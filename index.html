<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cudmore Luxury Home Management</title>
    <meta name="description" content="A New Standard in Luxury Home Management Is Coming Soon.">
    <meta name="theme-color" content="#12385b">
    <style>
      :root {
        --ink: #f7f4ee;
        --blue: #12385b;
        --sans: Gotham, "Gotham Medium", "Gotham Book", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        color: var(--ink);
        font-family: var(--sans);
        background: var(--blue);
      }

      .hero {
        position: relative;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        overflow: hidden;
        padding: clamp(1.25rem, 3vw, 2.25rem) clamp(1.25rem, 4vw, 4.5rem) clamp(2.5rem, 7vh, 4.75rem);
      }

      .hero-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 58%;
      }

      .scrim {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            to top,
            rgba(8, 22, 38, 0.62) 0%,
            rgba(18, 56, 91, 0.22) 36%,
            rgba(18, 56, 91, 0) 62%
          ),
          linear-gradient(
            to right,
            rgba(8, 22, 38, 0.28) 0%,
            rgba(8, 22, 38, 0) 52%
          );
      }

      .logo {
        position: relative;
        z-index: 1;
        width: min(630px, 90vw);
        height: auto;
        display: block;
        margin-bottom: auto;
      }

      .copy {
        position: relative;
        z-index: 1;
        max-width: min(980px, 92vw);
      }

      h1 {
        margin: 0;
        font-family: var(--sans);
        font-weight: 500;
        font-style: normal;
        font-size: clamp(2.35rem, 5.4vw, 4.7rem);
        line-height: 0.98;
        letter-spacing: -0.025em;
      }

      .contact {
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
        margin-top: clamp(1.4rem, 3vh, 2rem);
        padding: 0.9rem 1.25rem 0.9rem 1.4rem;
        border: 1px solid rgba(247, 244, 238, 0.88);
        border-radius: 999px;
        color: var(--ink);
        font-family: var(--sans);
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-decoration: none;
      }

      .contact svg {
        width: 1rem;
        height: 1rem;
      }

      .contact:hover {
        background: var(--ink);
        color: var(--blue);
      }

      .contact:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 4px;
      }

      @media (max-width: 640px) {
        .hero {
          padding-bottom: 2.25rem;
        }

        h1 {
          font-size: clamp(2.15rem, 11vw, 3rem);
        }

        .copy {
          max-width: 92vw;
        }
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <img class="hero-photo" src="assets/residence.jpg" alt="Contemporary coastal home at dusk">
      <div class="scrim" aria-hidden="true"></div>
      <img class="logo" src="assets/logo.png" alt="Cudmore Luxury Home Management">
      <div class="copy">
        <h1>A New Standard<br>in Luxury Home Management<br>Is Coming Soon.</h1>
        <a class="contact" href="mailto:info@beaconpropertycare.com">
          Contact Us
          <svg viewBox="0 0 16 16" aria-hidden="true" fill="none">
            <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </section>
  </body>
</html>
